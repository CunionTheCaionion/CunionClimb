<!DOCTYPE html>
<html>
<head>
    <title>CUNION CLIMB - Protocol Edition</title>
    <style>
        body { margin: 0; background: #010101; overflow: hidden; font-family: 'Courier New', monospace; cursor: none; }
        canvas { display: block; }
        #ui-container { position: absolute; top: 20px; left: 20px; color: #0ff; pointer-events: none; z-index: 10; }
        .stat-text { font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #0ff; margin-bottom: 5px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; cursor: default; }
        .menu-box { padding: 40px; border: 2px solid #0ff; background: #000; text-align: center; box-shadow: 0 0 20px #0ff; min-width: 320px; }
        input { background: #000; border: 1px solid #0ff; color: #fff; padding: 10px; font-family: 'Courier New'; margin: 10px; width: 200px; outline: none; }
        button { background: #0ff; border: none; padding: 10px 20px; font-family: 'Courier New'; font-weight: bold; cursor: pointer; margin: 5px; width: 100%; max-width: 240px; transition: 0.2s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        #skin-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .skin-item { border: 2px solid #333; padding: 15px; background: #050505; transition: 0.3s; }
        .hidden { display: none !important; }
        #sync-notice { color: #f0f; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="menu-box" id="main-menu">
            <h1 style="color:#0ff; margin:0;">CUNION CLIMB</h1>
            <p style="color:#0ff; font-size: 10px; letter-spacing: 2px; margin-bottom: 20px;">UPLINK STABLE</p>
            <input type="text" id="name-input" placeholder="Pilot ID..." maxlength="12">
            <br>
            <input type="password" id="pass-input" placeholder="Access Key..." maxlength="12">
            <br>
            <button id="launch-btn" onclick="startGame()">LAUNCH ENGINE</button>
            <button onclick="showSkins()">SKIN PROTOCOLS</button>
            <div id="sync-notice"></div>
        </div>

        <div class="menu-box hidden" id="pause-menu">
            <h1 style="color:#0ff; margin:0;">PAUSED</h1>
            <button onclick="resumeGame()">RESUME</button>
            <button onclick="showSkins()">SKIN PROTOCOLS</button>
            <button onclick="logout()" style="background:#f00; color:#fff;">LOG OUT</button>
        </div>
        
        <div class="menu-box hidden" id="skin-menu">
            <h2 style="color:#f0f; margin:0; text-shadow: 0 0 10px #f0f;">EQUIPMENT BAY</h2>
            <p style="color:#fff">Altitude Credits: <span id="credit-count" style="color:#0f0">0</span>m</p>
            <div id="skin-list"></div>
            <br>
            <button onclick="backFromSkins()" style="background:#f0f; color:#000;">BACK</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="stat-text">PILOT: <span id="d-name">---</span></div>
        <div class="stat-text">ALTITUDE: <span id="height">0</span>m</div>
        <div class="stat-text" style="color:#f0f">BEST: <span id="best-height">0</span>m</div>
    </div>

    <canvas id="canvas"></canvas>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHJkxAWX4UT-PNL4OgwPxy6NX_U3VWCepesdlQ4h5BDY1FqVw1peosoFD2bIew1QBJ7A/exec"; 
const CREDIT_MULTIPLIER = 0.1; 

let gameActive = false;
let isPaused = false;
let riftsClearedSession = 0;
let user = { name: "Guest", pass: "", best: 0, credits: 0, color: "#0ff", unlocked: ["#0ff"] };

const skinData = [
    { name: "NEON_DEFAULT", color: "#0ff", cost: 0 },
    { name: "VIOLET_PULSE", color: "#f0f", cost: 1000 },
    { name: "SOLAR_FLARE", color: "#ff0", cost: 3000 },
    { name: "PHANTOM_ICE", color: "#fff", cost: 6000 }
];

function saveToDisk() { localStorage.setItem('cunion_v2_' + user.name, JSON.stringify(user)); }

async function startGame() {
    const name = document.getElementById('name-input').value.trim();
    const pass = document.getElementById('pass-input').value.trim();
    const notice = document.getElementById('sync-notice');
    if (!name || !pass) return;

    notice.innerText = "SYNCHRONIZING WITH UPLINK...";
    document.getElementById('launch-btn').disabled = true;

    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ type: "loadUser", name: name, pass: pass }),
            headers: { "Content-Type": "text/plain" }
        });
        const cloudData = await response.json();

        if (cloudData.exists) {
            user = {
                name: name,
                pass: pass,
                best: cloudData.best || 0,
                credits: cloudData.credits || 0,
                color: "#0ff",
                unlocked: cloudData.skins ? cloudData.skins.split(", ") : ["#0ff"]
            };
        } else {
            user = { name: name, pass: pass, best: 0, credits: 0, color: "#0ff", unlocked: ["#0ff"] };
        }
        
        document.getElementById('d-name').innerText = user.name;
        document.getElementById('best-height').innerText = user.best;
        document.getElementById('overlay').classList.add('hidden');
        notice.innerText = "";
        gameActive = true;
        isPaused = false;
    } catch (e) {
        alert("UPLINK ERROR: PLAYING IN OFFLINE MODE");
        user = { name: name, pass: pass, best: 0, credits: 0, color: "#0ff", unlocked: ["#0ff"] };
        document.getElementById('overlay').classList.add('hidden');
        gameActive = true;
    }
    document.getElementById('launch-btn').disabled = false;
}

function sendToLeaderboard() {
    fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ 
            type: "saveScore", 
            name: user.name, 
            pass: user.pass,
            score: user.best, 
            credits: Math.floor(user.credits),
            skins: user.unlocked.join(", ")
        }),
        mode: "no-cors"
    });
}

function togglePause() {
    if (!gameActive) return;
    isPaused = !isPaused;
    if (isPaused) {
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('pause-menu').classList.remove('hidden');
        document.getElementById('main-menu').classList.add('hidden');
    } else { resumeGame(); }
}

function resumeGame() {
    isPaused = false;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('pause-menu').classList.add('hidden');
}

function showSkins() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('pause-menu').classList.add('hidden');
    document.getElementById('skin-menu').classList.remove('hidden');
    renderSkins();
}

function backFromSkins() {
    document.getElementById('skin-menu').classList.add('hidden');
    if (gameActive) document.getElementById('pause-menu').classList.remove('hidden');
    else document.getElementById('main-menu').classList.remove('hidden');
}

function logout() {
    saveToDisk();
    sendToLeaderboard();
    gameActive = false;
    isPaused = false;
    document.getElementById('pause-menu').classList.add('hidden');
    document.getElementById('skin-menu').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('name-input').value = "";
    document.getElementById('pass-input').value = "";
    document.getElementById('height').innerText = "0";
    player.x = canvas.width / 2;
    player.y = FLOOR_Y - 30;
    player.vx = 0; player.vy = 0;
    player.hookedTo = null; player.history = [];
}

function renderSkins() {
    document.getElementById('credit-count').innerText = Math.floor(user.credits);
    const list = document.getElementById('skin-list');
    list.innerHTML = "";
    skinData.forEach(s => {
        const bought = user.unlocked.includes(s.color);
        list.innerHTML += `<div class="skin-item" style="border-color: ${s.color};">
            <div style="color:${s.color}; font-size: 12px;">${s.name}</div>
            ${bought ? `<button onclick="setSkin('${s.color}')" style="background:${s.color}; color:#000;">EQUIP</button>` : `<button onclick="buySkin('${s.color}',${s.cost})">BUY ${s.cost}</button>`}
        </div>`;
    });
}

function buySkin(c, cost) { if(user.credits >= cost) { user.credits -= cost; user.unlocked.push(c); saveToDisk(); renderSkins(); } }
function setSkin(c) { user.color = c; saveToDisk(); backFromSkins(); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GRAVITY = 0.28, FRICTION_AIR = 0.985, FRICTION_GROUND = 0.85;
const WALK_SPEED = 0.7, JUMP_FORCE = -10, SWING_FORCE = 0.6, HOOK_RANGE = 380, MEGA_LAUNCH = -52;
const FLOOR_Y = canvas.height - 50;

let player = { x: canvas.width/2, y: FLOOR_Y-30, vx: 0, vy: 0, hookedTo: null, ropeLen: 0, radius: 15, onGround: false, history: [], launchCooldown: 0, rotation: 0 };
let mouse = { x: 0, y: 0 }, currentTarget = null, shakeTime = 0, keys = {}, anchors = [], powerUps = [];

for (let i = 0; i < 2000; i++) {
    let ay = (canvas.height - 250) - (i * 180);
    anchors.push({ x: Math.random() * (canvas.width - 200) + 100, y: ay });
    if (i % 15 === 0 && i > 0) powerUps.push({ x: Math.random() * (canvas.width - 200) + 100, y: ay - 90, radius: 35, active: true, rot: 0 });
}

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Escape') togglePause(); });
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousedown', () => { 
    if(!gameActive || isPaused || !currentTarget) return;
    player.hookedTo = currentTarget; 
    player.ropeLen = Math.sqrt((player.x-currentTarget.x)**2+(player.y-currentTarget.y)**2); 
});
window.addEventListener('mouseup', () => player.hookedTo = null);

function update() {
    if (!gameActive || isPaused) return;
    let camY = Math.min(0, player.y - canvas.height * 0.7);
    if (player.launchCooldown > 0) player.launchCooldown--;
    player.rotation += player.vx * 0.05;
    player.history.push({x: player.x, y: player.y});
    if (player.history.length > 20) player.history.shift();
    currentTarget = null;
    anchors.forEach(a => {
        let d = Math.sqrt((mouse.x - a.x)**2 + (mouse.y - (a.y - camY))**2);
        if (d < 55 && Math.sqrt((player.x - a.x)**2 + (player.y - a.y)**2) < HOOK_RANGE) currentTarget = a;
    });
    powerUps.forEach(p => {
        if (p.active && player.launchCooldown === 0) {
            if (Math.sqrt((player.x-p.x)**2+(player.y-p.y)**2) < player.radius + p.radius) {
                player.vy = MEGA_LAUNCH; player.vx *= 1.4; player.hookedTo = null; 
                player.launchCooldown = 120; shakeTime = 25; riftsClearedSession++;
            }
        }
    });
    if (player.hookedTo) {
        let dx = player.x-player.hookedTo.x, dy = player.y-player.hookedTo.y, dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > player.ropeLen) {
            let angle = Math.atan2(dy, dx);
            player.x = player.hookedTo.x + Math.cos(angle)*player.ropeLen;
            player.y = player.hookedTo.y + Math.sin(angle)*player.ropeLen;
            let vDot = player.vx*Math.cos(angle) + player.vy*Math.sin(angle);
            player.vx -= vDot*Math.cos(angle)*1.1; player.vy -= vDot*Math.sin(angle)*1.1;
        }
        if (keys['KeyA'] || keys['ArrowLeft']) player.vx -= SWING_FORCE;
        if (keys['KeyD'] || keys['ArrowRight']) player.vx += SWING_FORCE;
    } else if (player.onGround) {
        if (keys['KeyA'] || keys['ArrowLeft']) player.vx -= WALK_SPEED;
        if (keys['KeyD'] || keys['ArrowRight']) player.vx += WALK_SPEED;
        if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) player.vy = JUMP_FORCE;
        player.vx *= FRICTION_GROUND;
    }
    player.vy += GRAVITY; player.vx *= FRICTION_AIR; player.vy *= FRICTION_AIR;
    player.x += player.vx; player.y += player.vy;
    if (player.y > FLOOR_Y - player.radius) { player.y = FLOOR_Y-player.radius; player.vy = 0; player.onGround = true; } 
    else { player.onGround = false; }
    if (player.x < player.radius || player.x > canvas.width-player.radius) { player.vx *= -0.5; player.x = (player.x < player.radius) ? player.radius : canvas.width-player.radius; }
    if (shakeTime > 0) shakeTime--;
    let h = Math.floor(Math.max(0, (FLOOR_Y - player.radius - player.y)/10));
    document.getElementById('height').innerText = h;
    if(h > user.best) { 
        let gain = (h - user.best) * CREDIT_MULTIPLIER;
        user.best = h; user.credits += gain;
        document.getElementById('best-height').innerText = h; 
        if(h > 0 && h % 50 === 0) { saveToDisk(); sendToLeaderboard(); }
    }
}

function draw() {
    let camY = Math.min(0, player.y - canvas.height * 0.7);
    ctx.save();
    if (shakeTime > 0) ctx.translate(Math.random()*10-5, Math.random()*10-5);
    ctx.fillStyle = "#010101"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, FLOOR_Y-camY, canvas.width, 300);
    ctx.strokeStyle = "#0ff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, FLOOR_Y-camY); ctx.lineTo(canvas.width, FLOOR_Y-camY); ctx.stroke();

    if (player.history.length > 2) {
        for (let i = 0; i < player.history.length - 1; i++) {
            let p1 = player.history[i], p2 = player.history[i+1], ratio = i/player.history.length;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y-camY); ctx.lineTo(p2.x, p2.y-camY);
            ctx.lineWidth = ratio * 20; ctx.globalAlpha = ratio*0.4;
            ctx.strokeStyle = player.launchCooldown > 0 ? "#fff" : user.color; ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    powerUps.forEach(p => {
        ctx.save(); ctx.translate(p.x, p.y-camY); ctx.rotate(Date.now()*0.002);
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI*2);
        ctx.strokeStyle = "#a0f"; ctx.setLineDash([5, 10]); ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = "rgba(160, 0, 255, 0.2)"; ctx.fill(); ctx.restore();
    });

    anchors.forEach(a => {
        let isT = (a === currentTarget || a === player.hookedTo);
        ctx.beginPath(); ctx.arc(a.x, a.y-camY, isT?10:5, 0, Math.PI*2);
        ctx.fillStyle = isT?"#fff":"#333"; ctx.fill();
    });

    if (player.hookedTo) { 
        ctx.beginPath(); ctx.moveTo(player.x, player.y-camY); 
        ctx.lineTo(player.hookedTo.x, player.hookedTo.y-camY); 
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); 
    }

    ctx.save();
    ctx.translate(player.x, player.y - camY);
    ctx.rotate(player.rotation);
    let pCol = player.launchCooldown > 0 ? "#fff" : user.color;
    let isPremium = user.color !== "#0ff";

    if (isPremium) {
        ctx.strokeStyle = pCol; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-15, -10); ctx.lineTo(-15, 10); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(15, -10); ctx.lineTo(15, 10); ctx.closePath(); ctx.stroke();
        let time = Date.now() * 0.005;
        for(let i=0; i<3; i++) {
            ctx.save();
            let rot = time + (i * (Math.PI * 2 / 3));
            ctx.rotate(rot); ctx.translate(28, 0);
            ctx.fillStyle = pCol;
            if (user.color === "#f0f") { ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(4, 0); ctx.lineTo(0, 4); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill(); }
            else if (user.color === "#ff0") { ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(4, 3); ctx.lineTo(-4, 3); ctx.closePath(); ctx.fill(); }
            else if (user.color === "#fff") { ctx.fillRect(-3, -3, 6, 6); }
            ctx.restore();
        }
    }
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI*2); 
    ctx.fillStyle = "#000"; ctx.fill();
    ctx.strokeStyle = pCol; ctx.lineWidth = 3; ctx.stroke();
    let pulse = (Math.sin(Date.now()*0.01) + 1) / 2;
    ctx.beginPath(); ctx.arc(0, 0, player.radius * 0.6, 0, Math.PI*2);
    ctx.fillStyle = pCol; ctx.globalAlpha = 0.3 + (pulse * 0.4); ctx.fill();
    ctx.restore();
    
    if (!isPaused && gameActive) {
        ctx.restore();
        ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 45, 0, Math.PI*2); 
        ctx.strokeStyle = "rgba(255,255,255,0.4)"; 
        ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
    } else { ctx.restore(); }
    update(); requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
